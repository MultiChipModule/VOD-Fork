name: Build VOD-Fork

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - run: dotnet publish Jellyfin.Plugin.VOD --configuration Release --no-restore --output publish
      - run: python3 scripts/package-release.py publish artifacts --timestamp "$(git show -s --format=%cI)"
      - name: Verify package
        working-directory: artifacts
        run: |
          sha256sum -c ./*.sha256
          unzip -t ./*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vod-fork
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
